[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/purchases"
  to = "/.netlify/functions/purchases"
  status = 200

[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/orders-item?id=:splat"
  status = 200

[[redirects]]
  from = "/api/purchases/*"
  to = "/.netlify/functions/purchases-item?id=:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
